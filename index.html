    <script>
      ;(function () {
        var d = document.documentElement,
          t = null
        try {
          t = localStorage.getItem('tui-theme')
        } catch (e) {}
        // the app validates the id later; unknown ids fall back to :root (vitesse-black).
        // no saved theme = follow the system (the app keeps following it live)
        d.dataset.theme = /^[a-z0-9-]+$/.test(t || '')
          ? t
          : matchMedia('(prefers-color-scheme: light)').matches
            ? 'vitesse-light'
            : 'vitesse-black'
        // text fonts: free/open, self-hosted full builds (public/fonts) so box and status glyphs draw in them.
        // one size for all, so switching fonts does not move the layout
        var F = (window.TUI_FONTS = [
          { id: 'xanh-mono', name: 'Xanh Mono', size: 13, css: [] },
          { id: 'go-mono', name: 'Go Mono', size: 13, css: [] },
          { id: 'jetbrains-mono', name: 'JetBrains Mono', size: 13, css: [] },
          { id: 'geist-mono', name: 'Geist Mono', size: 13, css: [] },
          { id: 'adwaita-mono', name: 'Adwaita Mono', size: 13, css: [] },
          { id: 'fira-code', name: 'Fira Code', size: 13, css: [] },
          {
            id: 'ubuntu-sans-mono',
            name: 'Ubuntu Sans Mono',
            size: 13,
            css: [],
          },
          { id: 'commit-mono', name: 'Commit Mono', size: 13, css: [] },
          { id: 'source-code-pro', name: 'Source Code Pro', size: 13, css: [] },
          { id: 'victor-mono', name: 'Victor Mono', size: 13, css: [] },
          { id: 'maple-mono', name: 'Maple Mono', size: 13, css: [] },
        ])
        // heading (pixel) fonts. sizes per font live in src/styles.css under [data-pixel]
        var FSRC = 'https://cdn.jsdelivr.net/npm/@fontsource/'
        var P = (window.TUI_PIXELS = [
          {
            id: 'geist-pixel',
            name: 'Geist Pixel',
            css: [FSRC + 'geist-pixel@5.3.0/400.css'],
          },
          // unmodified 2 MB file (the licence reserves its name, so it cannot be subset); loads only when picked
          {
            id: 'unifontex',
            name: 'UnifontEX',
            css: [FSRC + 'unifontex@5.3.0/400.css'],
          },
        ])
        var loaded = {}
        window.TUI_LOAD_FONT = function (f) {
          f.css.forEach(function (u) {
            if (loaded[u]) return
            loaded[u] = 1
            var l = document.createElement('link')
            l.rel = 'stylesheet'
            l.href = u
            document.head.appendChild(l)
          })
        }
        var pick = function (list, id) {
          return (
            list.filter(function (x) {
              return x.id === id
            })[0] || list[0]
          )
        }
        window.TUI_SET_FONT = function (id) {
          var f = pick(F, id)
          window.TUI_LOAD_FONT(f)
          d.dataset.font = f.id
          // Adwaita Mono has every terminal glyph the site uses; it fills the gaps of the chosen font
          d.style.setProperty(
            '--m',
            '"' + f.name + '", "Adwaita Mono", var(--mono-fallback)',
          )
          d.style.setProperty('--fz', String(f.size / 13))
          return f
        }
        window.TUI_SET_PIXEL = function (id) {
          var f = pick(P, id)
          window.TUI_LOAD_FONT(f)
          d.dataset.pixel = f.id
          d.style.setProperty('--px', '"' + f.name + '", var(--mono-fallback)')
          return f
        }
        var f = null,
          px = null
        try {
          f = localStorage.getItem('tui-font')
          px = localStorage.getItem('tui-pixel')
        } catch (e) {}
        f = { geist: 'geist-mono', jetbrains: 'jetbrains-mono' }[f] || f // ids from the first version
        window.TUI_SET_FONT(f) // removed fonts fall back to the first one
        window.TUI_SET_PIXEL(px)
        d.className = /[?&]plain\b/.test(location.search) ? 'plain' : 'tui'
      })()
    </script>
