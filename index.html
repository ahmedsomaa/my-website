      ;(function () {
        var d = document.documentElement,
          t = null
        try {
          t = localStorage.getItem('tui-theme')
        } catch (e) {}
        // the app validates the id later; unknown ids fall back to :root (rose-pine-main)
        d.dataset.theme = /^[a-z0-9-]+$/.test(t || '')
          ? t
          : matchMedia('(prefers-color-scheme: light)').matches
            ? 'rose-pine-dawn'
            : 'rose-pine-main'
        // fonts: free/open only. size = px at which the x-height matches JetBrains Mono at 13px (measured)
        var FS = 'https://cdn.jsdelivr.net/npm/@fontsource/',
          W3 = ['400', '500', '700']
        var fs = function (n, w) {
          return (w || W3).map(function (x) {
            return FS + n + '@5.3.0/' + x + '.css'
          })
        }
        var F = (window.TUI_FONTS = [
          { id: 'jetbrains-mono', name: 'JetBrains Mono', size: 13, css: [] },
          {
            id: 'geist-mono',
            name: 'Geist Mono',
            size: 14,
            css: fs('geist-mono'),
            note: 'Vercel: 14/20, no ligatures, tabular nums',
          },
          {
            id: 'inconsolata',
            name: 'Inconsolata',
            size: 15.5,

          {

          },
          {
            id: 'ibm-plex-mono',
            name: 'IBM Plex Mono',
            size: 14,
            css: fs('ibm-plex-mono'),
          },
          {
            id: 'dm-mono',
            name: 'DM Mono',
            size: 14.5,
            css: fs('dm-mono', ['400', '500']),
          },
          {
            id: 'chivo-mono',
            name: 'Chivo Mono',
            size: 14,
            css: fs('chivo-mono'),
          },
          {
            id: 'maple-mono',
            name: 'Maple Mono',
            size: 13,
            css: fs('maple-mono'),
          },
          {
            id: 'hack',
            name: 'Hack',
            size: 13,
            css: [
              'https://cdn.jsdelivr.net/npm/hack-font@3.3.0/build/web/hack-subset.css',
            ],
          },
          { id: 'zed-mono', name: 'Zed Mono', size: 13.5, css: [] },
          {
            id: 'fantasque-sans-mono',
            name: 'Fantasque Sans Mono',
            size: 14,
            css: [],
          },
          { id: 'brass-mono', name: 'Brass Mono', size: 15, css: [] },
        ])
        var loaded = {}
        window.TUI_LOAD_FONT = function (f) {
          f.css.forEach(function (u) {
            if (loaded[u]) return
            loaded[u] = 1
            var l = document.createElement('link')
            l.rel = 'stylesheet'
            l.href = u
            document.head.appendChild(l)
          })
        }
        window.TUI_SET_FONT = function (id) {
          var f =
            F.filter(function (x) {
              return x.id === id
            })[0] || F[0]
          window.TUI_LOAD_FONT(f)
          d.dataset.font = f.id
          d.style.setProperty('--m', '"' + f.name + '", var(--mono-fallback)')
          d.style.setProperty('--fz', String(f.size / 13))
          return f
        }
        var f = null
        try {
          f = localStorage.getItem('tui-font')
        } catch (e) {}
        f = { geist: 'geist-mono', jetbrains: 'jetbrains-mono' }[f] || f // ids from the first version
        window.TUI_SET_FONT(f)
        d.className = /[?&]plain\b/.test(location.search) ? 'plain' : 'tui'
      })()
